<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0808" />
      <stop offset="60%" stop-color="#120404" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4040" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Grid Tech Lines -->
  <path d="M0 100 H400 M0 200 H400 M0 300 H400 M100 0 V400 M200 0 V400 M300 0 V400" stroke="#FF2020" stroke-width="0.5" stroke-opacity="0.15" />

  <!-- Outer Neon Hexagon/Circle Ring -->
  <circle cx="200" cy="190" r="140" fill="none" stroke="#FF2020" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6" />
  <circle cx="200" cy="190" r="125" fill="none" stroke="#FF3030" stroke-width="1.5" stroke-opacity="0.8" filter="url(#glow)" />

  <!-- Avatar Silhouette - Developer / Cyberpunk -->
  <!-- Shoulders & Hoodie -->
  <path d="M100 370 C100 300, 140 270, 200 270 C260 270, 300 300, 300 370 Z" fill="#181818" stroke="#FF2020" stroke-width="1.5" stroke-opacity="0.7" />
  
  <!-- Hoodie Collar -->
  <path d="M150 275 L200 320 L250 275" fill="none" stroke="#FF3030" stroke-width="2.5" />

  <!-- Head -->
  <ellipse cx="200" cy="195" rx="58" ry="72" fill="#202020" stroke="#FF2020" stroke-width="1" />

  <!-- Hair / Cap -->
  <path d="M140 185 C140 125, 260 125, 260 185 C250 145, 150 145, 140 185 Z" fill="#0D0D0D" stroke="#FF2020" stroke-width="1.5" />

  <!-- Cyber Visor / Glasses with Neon Red Glow -->
  <rect x="152" y="180" width="96" height="24" rx="6" fill="#080808" stroke="#FF2020" stroke-width="2" filter="url(#glow)" />
  <line x1="160" y1="192" x2="240" y2="192" stroke="#FF4040" stroke-width="2" stroke-dasharray="14 4" />

  <!-- Chin / Face line -->
  <path d="M175 240 Q200 255 225 240" stroke="#333" stroke-width="2" fill="none" />

  <!-- HUD Overlay Elements -->
  <text x="200" y="380" font-family="'Space Grotesk', monospace" font-size="12" font-weight="900" fill="#FF2020" text-anchor="middle" letter-spacing="4">
    CHARLES // DEV
  </text>
  <circle cx="200" cy="50" r="4" fill="#00FF66" filter="url(#glow)" />
</svg>
